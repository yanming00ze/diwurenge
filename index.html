<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>活動頁面</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: #25b8df;
    font-family: "Microsoft JhengHei", "Noto Sans TC", sans-serif;
  }

  .page {
    width: min(100%, 980px);
    margin: 0 auto;
    position: relative;
  }

  /* 主視覺 */
  .hero {
    display: block;
    width: 100%;
    height: auto;
  }

  /* 可點擊的領取區域。
     若你想換網址，只要修改 href 即可。 */
  .claim-link {
    position: absolute;
    left: 20%;
    width: 60%;
    bottom: 3.3%;
    height: 8%;
    display: block;
    border-radius: 60px;
    text-decoration: none;
    cursor: pointer;
    transition: transform .15s ease, filter .15s ease;
  }

  .claim-link:hover {
    transform: scale(1.02);
    filter: brightness(1.08);
  }

  .claim-link:active {
    transform: scale(.98);
  }

  /* 手機版 */
  @media (max-width: 600px) {
    .claim-link {
      left: 18%;
      width: 64%;
      bottom: 3.1%;
      height: 8%;
    }
  }
</style>
</head>

<body>
  <main class="page">
    <img class="hero" src="event.png" alt="活動頁面">

    <!-- 把下面網址換成你自己的活動/領取網址 -->
    <a
      class="claim-link"
      href="https://lin.ee/OxCEPHo"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="立即領取"
    ></a>
  </main>
</body>
</html>
