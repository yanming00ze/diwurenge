<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#25b8df">

  <title>追光逐夢・亞運聯動｜活動頁面</title>
  <meta name="description" content="參與限時聯動活動，領取專屬活動獎勵。">

  <!-- Threads / Facebook / LINE 等社群預覽 -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="追光逐夢・亞運聯動">
  <meta property="og:description" content="參與限時聯動活動，領取專屬活動獎勵。">
  <meta property="og:url" content="https://yanming00ze.github.io/">
  <meta property="og:image" content="https://yanming00ze.github.io/event.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:site_name" content="活動頁面">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="追光逐夢・亞運聯動">
  <meta name="twitter:description" content="參與限時聯動活動，領取專屬活動獎勵。">
  <meta name="twitter:image" content="https://yanming00ze.github.io/event.png">

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      margin: 0;
      padding: 0;
      background: #25b8df;
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background:
        linear-gradient(
          180deg,
          #25b8df 0%,
          #25b8df 78%,
          #1aaed5 100%
        );
      font-family: "Microsoft JhengHei", "Noto Sans TC", sans-serif;
      overflow-x: hidden;
    }

    .page {
      width: min(100%, 980px);
      margin: 0 auto;
      position: relative;
      padding-bottom: max(72px, env(safe-area-inset-bottom));
    }

    /* 主視覺：不裁切、不固定高度，手機會完整顯示 */
    .hero-wrap {
      position: relative;
      width: 100%;
      line-height: 0;
    }

    .hero {
      display: block;
      width: 100%;
      height: auto;
      max-width: 100%;
      object-fit: contain;
    }

    /*
      領取按鈕：
      原本頁面只有透明點擊區，視覺完全依賴 event.png。
      這裡保留原本圖片，不改圖片內容，只在按鈕位置增加
      輕微發光、呼吸與按壓效果。
    */
    .claim-link {
      position: absolute;
      left: 20%;
      width: 60%;
      bottom: 3.3%;
      height: 8%;
      min-height: 52px;

      display: block;
      border-radius: 999px;
      text-decoration: none;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;

      /* 不遮掉原本按鈕，只增加互動感 */
      box-shadow:
        0 0 0 0 rgba(255, 232, 146, 0),
        0 0 22px 5px rgba(255, 224, 112, .28);

      transition:
        transform .16s ease,
        filter .16s ease,
        box-shadow .16s ease;

      animation: claimPulse 2.2s ease-in-out infinite;
    }

    .claim-link::after {
      content: "";
      position: absolute;
      inset: 7% 3%;
      border-radius: inherit;
      background: linear-gradient(
        105deg,
        transparent 20%,
        rgba(255,255,255,0) 35%,
        rgba(255,255,255,.48) 50%,
        rgba(255,255,255,0) 65%,
        transparent 80%
      );
      transform: translateX(-120%);
      pointer-events: none;
      animation: buttonShine 3.8s ease-in-out infinite;
    }

    .claim-link:hover {
      transform: scale(1.025);
      filter: brightness(1.08);
      box-shadow:
        0 0 0 2px rgba(255,255,255,.18),
        0 0 30px 8px rgba(255, 224, 112, .42);
      animation-play-state: paused;
    }

    .claim-link:active {
      transform: scale(.96);
      filter: brightness(.98);
    }

    @keyframes claimPulse {
      0%, 100% {
        box-shadow:
          0 0 0 0 rgba(255, 232, 146, 0),
          0 0 18px 3px rgba(255, 224, 112, .20);
      }
      50% {
        box-shadow:
          0 0 0 5px rgba(255, 232, 146, .08),
          0 0 28px 8px rgba(255, 224, 112, .38);
      }
    }

    @keyframes buttonShine {
      0%, 45% {
        transform: translateX(-120%);
      }
      70%, 100% {
        transform: translateX(120%);
      }
    }

    /*
      底部區域：
      原本 HTML 在圖片結束後就直接結束，手機看起來會像「下面少了一段」。
      這裡保留藍色背景並留出安全區，避免瀏覽器底部 UI 貼住內容。
    */
    .bottom-space {
      height: 64px;
    }

    @media (max-width: 600px) {
      .page {
        width: 100%;
        padding-bottom: max(88px, env(safe-area-inset-bottom));
      }

      .claim-link {
        left: 17%;
        width: 66%;
        bottom: 3.1%;
        height: 8.5%;
        min-height: 48px;
      }

      .bottom-space {
        height: 88px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .claim-link,
      .claim-link::after {
        animation: none;
      }

      .claim-link {
        transition: none;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <section class="hero-wrap" aria-label="活動內容">
      <img
        class="hero"
        src="event.png"
        alt="追光逐夢・亞運聯動活動頁面"
      >

      <!-- 保留原本領取網址；只增加互動效果 -->
      <a
        class="claim-link"
        href="https://lin.ee/OxCEPHo"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="立即領取"
      ></a>
    </section>

    <div class="bottom-space" aria-hidden="true"></div>
  </main>
</body>
</html>
